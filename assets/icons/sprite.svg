<!-- ===========================================================================
     Interactive Physics Book — unified line-icon set (Feather/Lucide-style:
     24x24 viewBox, stroke-width 2, round line caps/joins, stroke="currentColor",
     no fills, no hardcoded colors) replacing raw emoji used as UI icons.

     This file is the canonical SOURCE for the icon set (open it directly in
     a browser or SVG editor to preview/edit any symbol). It is NOT loaded by
     pages directly — see assets/js/icons.js's header comment for why an
     external <use href="sprite.svg#id"> reference does not work over the
     file:// protocol this site must also support, and how the same symbol
     markup below is instead injected into every page at runtime.

     Keep this file and assets/js/icons.js's SPRITE_MARKUP string in sync by
     hand when adding/editing an icon — see that file's header comment.
     =========================================================================== -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

  <!-- Lesson section chrome (objectives / explanation / examples / simulation / quiz / summary / mind map) -->
  <symbol id="icon-target" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
  </symbol>

  <symbol id="icon-lightbulb" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18h6"/><path d="M10 21h4"/>
    <path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3Z"/>
  </symbol>

  <symbol id="icon-pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="M15 5l4 4"/>
  </symbol>

  <symbol id="icon-joystick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
